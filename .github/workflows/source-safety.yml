name: Source safety
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python macos/scripts/install_gitleaks.py
      - run: python macos/scripts/audit_source.py --history
